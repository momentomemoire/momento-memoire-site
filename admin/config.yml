backend:
  name: git-gateway
  branch: main

# Media (images/videos) the manager uploads get stored here in the repo
# and served at /uploads/... on the live site.
media_folder: "uploads"
public_folder: "/uploads"

site_url: https://your-site-name.netlify.app
display_url: https://your-site-name.netlify.app

collections:
  - name: "site"
    label: "✏️ Site Text"
    files:
      - file: "content/site.json"
        label: "Site Text"
        name: "site"
        fields:
          - label: "Hero (top of homepage)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small label above heading", name: "eyebrow", widget: "string" }
              - { label: "Heading — line 1", name: "heading_line1", widget: "string" }
              - { label: "Heading — line 2", name: "heading_line2", widget: "string" }
              - { label: "Subtext", name: "subtext", widget: "text" }
              - { label: "Meta line 1", name: "meta_line1", widget: "string", required: false, hint: "e.g. ROLL 07 — 36 EXP" }
              - { label: "Meta line 2", name: "meta_line2", widget: "string", required: false, hint: "e.g. f/2.8 · 1/125 · ISO 400" }
              - { label: "Meta line 3", name: "meta_line3", widget: "string", required: false, hint: "e.g. DEVELOPED ON REQUEST" }
          - { label: "Reels — section heading", name: "reels_heading", widget: "string" }
          - { label: "Reels — small tag", name: "reels_tag", widget: "string", required: false }
          - { label: "Reels — intro line", name: "reels_lead", widget: "text" }
          - { label: "Albums — section heading", name: "albums_heading", widget: "string" }
          - { label: "Albums — small tag", name: "albums_tag", widget: "string", required: false }
          - { label: "Albums — intro line", name: "albums_lead", widget: "text" }
          - label: "Services"
            name: "services"
            widget: "object"
            fields:
              - { label: "Section heading", name: "heading", widget: "string" }
              - { label: "Small tag", name: "tag", widget: "string", required: false }
              - label: "Service 1"
                name: "item1"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Delivery note", name: "spec", widget: "string", required: false }
              - label: "Service 2"
                name: "item2"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Delivery note", name: "spec", widget: "string", required: false }
              - label: "Service 3"
                name: "item3"
                widget: "object"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
                  - { label: "Delivery note", name: "spec", widget: "string", required: false }
          - label: "Process"
            name: "process"
            widget: "object"
            fields:
              - { label: "Section heading", name: "heading", widget: "string" }
              - { label: "Small tag", name: "tag", widget: "string", required: false }
              - label: "Step 1"
                name: "step1"
                widget: "object"
                fields:
                  - { label: "f-stop label", name: "fstop", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Step 2"
                name: "step2"
                widget: "object"
                fields:
                  - { label: "f-stop label", name: "fstop", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Step 3"
                name: "step3"
                widget: "object"
                fields:
                  - { label: "f-stop label", name: "fstop", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
              - label: "Step 4"
                name: "step4"
                widget: "object"
                fields:
                  - { label: "f-stop label", name: "fstop", widget: "string", required: false }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "description", widget: "text" }
          - label: "Testimonial"
            name: "testimonial"
            widget: "object"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Attribution", name: "cite", widget: "string", hint: "e.g. — Creative Director, Client Name" }
              - { label: "Slate label 1", name: "slate_prod", widget: "string", required: false }
              - { label: "Slate label 2", name: "slate_scene", widget: "string", required: false }
              - { label: "Slate label 3", name: "slate_take", widget: "string", required: false }
          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Heading — line 1", name: "heading_line1", widget: "string" }
              - { label: "Heading — line 2", name: "heading_line2", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Phone", name: "phone", widget: "string", required: false }
              - { label: "Address — line 1", name: "addr_line1", widget: "string", required: false }
              - { label: "Address — line 2", name: "addr_line2", widget: "string", required: false }
              - { label: "Address — line 3", name: "addr_line3", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram_url", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook_url", widget: "string", required: false }
              - { label: "Hours — line 1", name: "hours_line1", widget: "string", required: false }
              - { label: "Hours — line 2", name: "hours_line2", widget: "string", required: false }
              - { label: "Copyright line", name: "copyright", widget: "string" }
              - { label: "Roll tag (bottom right)", name: "roll_tag", widget: "string", required: false }

  - name: "reels"
    label: "🎬 Reels (Videos)"
    files:
      - file: "content/reels.json"
        label: "Reels"
        name: "reels"
        fields:
          - label: "Videos"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Title", name: "title", widget: "string", hint: "e.g. Meridian Hotel Group" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Brand Film", "Wedding", "Live Session", "Documentary", "Editorial", "Event", "Product"]
              - { label: "Duration", name: "duration", widget: "string", required: false, hint: "e.g. 1:24 — leave blank to hide" }
              - { label: "Short description", name: "blurb", widget: "string", required: false }
              - { label: "Video link", name: "video", widget: "string", required: false, pattern: ['^(https?:\/\/).*', "Please enter a full link starting with https://"], hint: "Paste a YouTube, Vimeo, Facebook, or Instagram video/reel link. Leave empty to show a placeholder clip." }
              - { label: "Thumbnail image", name: "poster", widget: "image", required: false, hint: "Optional. Leave empty to use a house placeholder pattern." }

  - name: "albums"
    label: "🖼️ Albums (Category / Event)"
    files:
      - file: "content/albums.json"
        label: "Albums"
        name: "albums"
        fields:
          - label: "Albums"
            name: "items"
            widget: "list"
            summary: "{{title}} — {{category}}"
            fields:
              - { label: "Album title", name: "title", widget: "string", hint: "e.g. Amara & Rafi" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["Wedding", "Brand", "Editorial", "Event", "Documentary", "Product"]
              - { label: "Date / event label", name: "date", widget: "string", hint: "e.g. Dec 2025" }
              - { label: "Cover image", name: "cover", widget: "image", required: false, hint: "Optional. Leave empty to use the first photo below." }
              - label: "Photos"
                name: "frames"
                widget: "list"
                summary: "{{caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
